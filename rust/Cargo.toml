[workspace]
resolver = "2"
members = [
    "crates/graph-core",
    "crates/dsp",
    "crates/engine",
    "crates/clap-runtime",
    "crates/build-service",
    "crates/render-tool",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
graph-core = { path = "crates/graph-core" }
dsp = { path = "crates/dsp" }
engine = { path = "crates/engine" }
clap-sys = "0.5.0"
rtrb = "0.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
